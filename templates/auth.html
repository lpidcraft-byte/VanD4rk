<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VanD4rk Hosting — Giriş</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#050509; --card:#0d0d16; --border:#1c1c2e;
    --accent:#8b5cf6; --accent2:#06b6d4; --text:#f1f5f9; --mut:#94a3b8;
    --ok:#10b981; --err:#ef4444; --warn:#f59e0b;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',sans-serif;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:#050509; color:var(--text); overflow:hidden;
    display:grid; place-items:center; perspective:1400px;
  }
  /* Animasyonlu arka plan katmanları */
  .bgLayer{ position:fixed; inset:0; pointer-events:none; z-index:0; }
  .bgLayer.grid{
    background-image:
      linear-gradient(rgba(139,92,246,.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(139,92,246,.07) 1px, transparent 1px);
    background-size:54px 54px;
    mask-image:radial-gradient(circle at center, black 20%, transparent 75%);
    animation:gridMove 22s linear infinite;
  }
  @keyframes gridMove{ to{ background-position: 54px 54px; } }
  .blob{
    position:fixed; border-radius:50%; filter:blur(90px); opacity:.55; pointer-events:none; z-index:0;
    animation:floatBlob 18s ease-in-out infinite;
  }
  .blob.b1{ width:520px;height:520px; background:#8b5cf6; top:-180px; left:-120px; }
  .blob.b2{ width:460px;height:460px; background:#06b6d4; bottom:-150px; right:-120px; animation-delay:-6s; }
  .blob.b3{ width:380px;height:380px; background:#ec4899; top:40%; left:60%; animation-delay:-12s; opacity:.3; }
  @keyframes floatBlob{
    0%,100%{ transform:translate(0,0) scale(1); }
    50%{ transform:translate(40px,-30px) scale(1.1); }
  }

  /* Parçacık canvas */
  #particles{ position:fixed; inset:0; z-index:1; pointer-events:none; }

  .scene{ position:relative; z-index:5; width:100%; max-width:440px; padding:22px; perspective:1200px; }

  .card{
    background:linear-gradient(155deg, rgba(20,20,32,.85), rgba(10,10,18,.95));
    border:1px solid var(--border); border-radius:26px;
    padding:40px 34px 30px;
    backdrop-filter:blur(22px);
    box-shadow:
      0 1px 0 rgba(255,255,255,.06) inset,
      0 40px 120px -30px rgba(139,92,246,.5),
      0 20px 60px rgba(0,0,0,.7);
    transform-style:preserve-3d;
    transition:transform .35s cubic-bezier(.2,.8,.2,1);
    animation:floatIn .9s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes floatIn{ from{opacity:0; transform:translateY(40px) rotateX(-10deg) scale(.94)} to{opacity:1; transform:none} }
  .scene:hover .card{ transform: rotateX(2.5deg) rotateY(-2.5deg); }

  .brand{ display:flex; align-items:center; gap:12px; margin-bottom:26px; }
  .brandIcon{
    width:48px;height:48px;border-radius:15px;
    background:linear-gradient(135deg,#8b5cf6,#06b6d4);
    display:grid; place-items:center;
    box-shadow:0 14px 36px -10px rgba(139,92,246,.7);
    transform:rotate(-8deg);
    transition:.3s;
  }
  .card:hover .brandIcon{ transform:rotate(0deg) scale(1.05); }
  .brandText h1{
    font-size:20px;font-weight:900;letter-spacing:-.6px;
    background:linear-gradient(90deg,#c4b5fd,#67e8f9);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .brandText p{ font-size:10px; color:var(--mut); font-weight:700; letter-spacing:1px; margin-top:2px; }

  .tabs{
    display:flex; gap:6px; margin-bottom:22px;
    background:#07070d; padding:6px; border-radius:16px;
    border:1px solid var(--border);
  }
  .tabs button{
    flex:1; background:transparent; border:none; padding:12px;
    border-radius:11px; color:var(--mut); font-weight:700;
    font-size:13px; cursor:pointer; transition:.25s;
  }
  .tabs button.active{
    background:linear-gradient(135deg,#8b5cf6,#06b6d4); color:#fff;
    box-shadow:0 10px 28px -8px rgba(139,92,246,.7);
  }

  .field{ margin-bottom:14px; }
  .field label{
    display:block; font-size:10px; color:var(--mut);
    margin-bottom:7px; font-weight:800;
    text-transform:uppercase; letter-spacing:.7px;
  }
  .field input{
    width:100%; padding:14px 16px;
    background:#07070d; border:1px solid var(--border);
    border-radius:13px; color:var(--text); font-size:14px; font-weight:500;
    outline:none; transition:.25s;
  }
  .field input:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 4px rgba(139,92,246,.15);
  }
  .field input::placeholder{ color:#475569; }
  .field input.valid{ border-color:rgba(16,185,129,.5); }
  .field input.invalid{ border-color:rgba(239,68,68,.5); }

  /* Şifre gücü */
  .pwStrength{ display:flex; gap:4px; margin-top:8px; height:4px; }
  .pwStrength div{ flex:1; background:#1c1c2e; border-radius:2px; transition:.3s; }
  .pwStrength.s1 div:nth-child(1){ background:#ef4444; }
  .pwStrength.s2 div:nth-child(-n+2){ background:#f59e0b; }
  .pwStrength.s3 div:nth-child(-n+3){ background:#eab308; }
  .pwStrength.s4 div{ background:#10b981; }
  .hint{ font-size:10px; color:var(--mut); margin-top:6px; font-weight:600; }

  .submitBtn{
    width:100%; padding:15px; margin-top:10px;
    border:none; border-radius:13px;
    background:linear-gradient(135deg,#8b5cf6,#06b6d4);
    color:#fff; font-weight:800; font-size:14px;
    cursor:pointer; transition:.25s;
    box-shadow:0 14px 34px -10px rgba(139,92,246,.7);
    position:relative; overflow:hidden;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .submitBtn:hover:not(:disabled){ filter:brightness(1.12); transform:translateY(-2px); }
  .submitBtn:active:not(:disabled){ transform:translateY(0); }
  .submitBtn:disabled{ opacity:.7; cursor:not-allowed; }
  .submitBtn .spinner{
    width:16px;height:16px;border:2px solid rgba(255,255,255,.3);
    border-top-color:#fff; border-radius:50%; animation:sp .7s linear infinite; display:none;
  }
  .submitBtn.loading .spinner{ display:block; }
  .submitBtn.loading .txt{ opacity:.6; }
  @keyframes sp{ to{ transform:rotate(360deg); } }

  .msg{
    padding:12px 14px; border-radius:12px; font-size:12px;
    margin-bottom:14px; font-weight:600; display:none;
  }
  .msg.show{ display:block; animation:slideIn .3s; }
  .msg.err{ background:rgba(239,68,68,.1); border:1px solid rgba(239,68,68,.35); color:#fca5a5; }
  .msg.ok{ background:rgba(16,185,129,.1); border:1px solid rgba(16,185,129,.35); color:#6ee7b7; }
  @keyframes slideIn{ from{opacity:0; transform:translateY(-8px)} to{opacity:1; transform:none} }

  .footNote{ text-align:center; font-size:10px; color:#475569; margin-top:20px; letter-spacing:.3px; }

  /* Kısayol ipucu */
  .kbdHint{
    text-align:center; font-size:10px; color:#475569;
    margin-top:14px; font-weight:600;
  }
  .kbdHint kbd{
    background:#12121e; border:1px solid var(--border);
    padding:2px 6px; border-radius:5px; font-size:9px;
    font-family:ui-monospace,monospace; color:var(--mut);
  }
</style>
</head>
<body>
<div class="bgLayer grid"></div>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<canvas id="particles"></canvas>

<div class="scene">
  <div class="card">
    <div class="brand">
      <div class="brandIcon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path d="M12 2L3 7l9 5 9-5-9-5z" fill="#fff"/>
          <path d="M3 12l9 5 9-5M3 17l9 5 9-5" stroke="#fff" stroke-width="1.6" stroke-linejoin="round" opacity=".7"/>
        </svg>
      </div>
      <div class="brandText">
        <h1>VanD4rk Hosting</h1>
        <p>TELEGRAM BOT PLATFORM</p>
      </div>
    </div>

    <div class="tabs">
      <button id="tabLogin" class="active" type="button">Giriş</button>
      <button id="tabReg" type="button">Kayıt</button>
    </div>

    <div class="msg" id="msg"></div>

    <!-- GİRİŞ -->
    <form id="loginForm" autocomplete="on">
      <div class="field">
        <label>Kullanıcı Adı</label>
        <input id="lu" name="username" autocomplete="username" placeholder="kullanici_adi" required>
      </div>
      <div class="field">
        <label>Şifre</label>
        <input id="lp" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required>
      </div>
      <button class="submitBtn" type="submit" id="btnLogin">
        <span class="spinner"></span>
        <span class="txt">Giriş Yap →</span>
      </button>
    </form>

    <!-- KAYIT -->
    <form id="regForm" style="display:none" autocomplete="on">
      <div class="field">
        <label>Kullanıcı Adı</label>
        <input id="ru" name="username" autocomplete="username" placeholder="kullanici_adi" required>
      </div>
      <div class="field">
        <label>Şifre</label>
        <input id="rp" name="password" type="password" autocomplete="new-password" placeholder="En az 6 karakter" required>
        <div class="pwStrength" id="pwStr"><div></div><div></div><div></div><div></div></div>
        <div class="hint" id="pwHint">Şifre gücü: —</div>
      </div>
      <button class="submitBtn" type="submit" id="btnReg">
        <span class="spinner"></span>
        <span class="txt">Kayıt Ol →</span>
      </button>
    </form>

    <p class="kbdHint">İpucu: <kbd>Enter</kbd> ile hızlı gönder</p>
    <p class="footNote">© VanD4rk Hosting · 3D Inter UI</p>
  </div>
</div>

<script>
(function(){
  'use strict';
  // ---------- Yardımcılar ----------
  const $ = id => document.getElementById(id);
  const msgBox = $('msg');
  function showMsg(text, type){
    msgBox.textContent = text;
    msgBox.className = 'msg show ' + type;
    clearTimeout(msgBox._t);
    msgBox._t = setTimeout(()=> msgBox.classList.remove('show'), 5000);
  }
  function hideMsg(){ msgBox.classList.remove('show'); }

  // ---------- Parçacık efekti ----------
  const canvas = $('particles'), ctx = canvas.getContext('2d');
  let particles = [];
  function resizeCanvas(){
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    particles = [];
    const count = Math.min(70, Math.floor(window.innerWidth/22));
    for(let i=0;i<count;i++){
      particles.push({
        x: Math.random()*canvas.width, y: Math.random()*canvas.height,
        vx: (Math.random()-.5)*.35, vy: (Math.random()-.5)*.35,
        r: Math.random()*1.8+.4,
        a: Math.random()*.5+.15,
        c: Math.random()>.5 ? '139,92,246' : '6,182,212'
      });
    }
  }
  function drawParticles(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    particles.forEach(p=>{
      p.x += p.vx; p.y += p.vy;
      if(p.x<0||p.x>canvas.width) p.vx *= -1;
      if(p.y<0||p.y>canvas.height) p.vy *= -1;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.fillStyle = `rgba(${p.c},${p.a})`;
      ctx.fill();
    });
    // Bağlantı çizgileri
    for(let i=0;i<particles.length;i++){
      for(let j=i+1;j<particles.length;j++){
        const dx = particles[i].x-particles[j].x, dy = particles[i].y-particles[j].y;
        const d = Math.hypot(dx,dy);
        if(d < 130){
          ctx.beginPath();
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(particles[j].x, particles[j].y);
          ctx.strokeStyle = `rgba(139,92,246,${(1-d/130)*.15})`;
          ctx.lineWidth = .6;
          ctx.stroke();
        }
      }
    }
    requestAnimationFrame(drawParticles);
  }
  resizeCanvas(); drawParticles();
  window.addEventListener('resize', resizeCanvas);

  // ---------- Sekme geçişi ----------
  $('tabLogin').addEventListener('click', ()=>{
    $('tabLogin').classList.add('active'); $('tabReg').classList.remove('active');
    $('loginForm').style.display=''; $('regForm').style.display='none';
    hideMsg();
  });
  $('tabReg').addEventListener('click', ()=>{
    $('tabReg').classList.add('active'); $('tabLogin').classList.remove('active');
    $('regForm').style.display=''; $('loginForm').style.display='none';
    hideMsg();
    setTimeout(()=>$('ru').focus(),100);
  });

  // ---------- Şifre gücü ----------
  $('rp').addEventListener('input', e=>{
    const v = e.target.value;
    let score = 0;
    if(v.length>=6) score++;
    if(v.length>=10) score++;
    if(/[A-Z]/.test(v) && /[a-z]/.test(v)) score++;
    if(/[0-9]/.test(v) && /[^a-zA-Z0-9]/.test(v)) score++;
    $('pwStr').className = 'pwStrength s'+score;
    const labels = ['—','Zayıf','Orta','İyi','Güçlü'];
    $('pwHint').textContent = 'Şifre gücü: ' + labels[score];
  });

  // ---------- Kullanıcı adı canlı kontrol ----------
  $('ru').addEventListener('input', e=>{
    const v = e.target.value;
    if(!v){ e.target.classList.remove('valid','invalid'); return; }
    if(/^[a-z0-9_]{3,20}$/.test(v)){ e.target.classList.add('valid'); e.target.classList.remove('invalid'); }
    else { e.target.classList.add('invalid'); e.target.classList.remove('valid'); }
  });

  // ---------- Buton loading ----------
  function setLoading(btn, on){
    btn.classList.toggle('loading', on);
    btn.disabled = on;
    btn.querySelector('.txt').textContent = on ? 'Gönderiliyor...' : btn.dataset.label;
  }
  $('btnLogin').dataset.label = $('btnLogin').querySelector('.txt').textContent;
  $('btnReg').dataset.label   = $('btnReg').querySelector('.txt').textContent;

  // ---------- Fetch helper ----------
  async function postJSON(url, body){
    const res = await fetch(url, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(body),
      credentials:'same-origin'
    });
    let data;
    try{ data = await res.json(); }
    catch(e){ data = {ok:false, error:'Sunucu yanıtı okunamadı ('+res.status+')'}; }
    return {status: res.status, data};
  }

  // ---------- Giriş ----------
  $('loginForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    hideMsg();
    const u = $('lu').value.trim();
    const p = $('lp').value;
    if(!u || !p){ showMsg('Kullanıcı adı ve şifre gerekli', 'err'); return; }
    const btn = $('btnLogin'); setLoading(btn, true);
    try{
      const {status, data} = await postJSON('/login', {username:u, password:p});
      if(data.ok){ showMsg('Giriş başarılı, yönlendiriliyor...', 'ok');
        setTimeout(()=> location.href = data.redirect || '/dashboard', 400); }
      else showMsg(data.error || 'Giriş başarısız ('+status+')', 'err');
    }catch(err){ showMsg('Bağlantı hatası: '+err.message, 'err'); }
    finally{ setLoading(btn, false); }
  });

  // ---------- Kayıt ----------
  $('regForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    hideMsg();
    const u = $('ru').value.trim().toLowerCase();
    const p = $('rp').value;
    if(!u || !p){ showMsg('Kullanıcı adı ve şifre gerekli', 'err'); return; }
    if(!/^[a-z0-9_]{3,20}$/.test(u)){ showMsg('Kullanıcı adı 3-20 karakter, sadece harf/rakam/_', 'err'); return; }
    if(p.length < 6){ showMsg('Şifre en az 6 karakter olmalı', 'err'); return; }
    const btn = $('btnReg'); setLoading(btn, true);
    try{
      const {status, data} = await postJSON('/register', {username:u, password:p});
      if(data.ok){ showMsg('Kayıt başarılı! Yönlendiriliyor...', 'ok');
        setTimeout(()=> location.href = data.redirect || '/dashboard', 500); }
      else showMsg(data.error || 'Kayıt başarısız ('+status+')', 'err');
    }catch(err){ showMsg('Bağlantı hatası: '+err.message, 'err'); }
    finally{ setLoading(btn, false); }
  });

  // ---------- Enter kısayolu zaten form submit ile çalışıyor ----------
})();
</script>
</body>
</html>
