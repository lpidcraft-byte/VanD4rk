<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VanD4rk Hosting — Giriş</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a0a12;--card:#11111c;--border:#1e1e30;--accent:#7c3aed;--accent2:#22d3ee;--text:#e5e7eb;--mut:#8b8fa3}
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',sans-serif}
  body{background:radial-gradient(1200px 800px at 20% 10%,#1a1030,transparent),radial-gradient(1000px 700px at 80% 90%,#0a1f2e,transparent),var(--bg);min-height:100vh;display:grid;place-items:center;color:var(--text);overflow:hidden}
  .scene{perspective:1200px;width:100%;max-width:440px;padding:20px}
  .card{background:linear-gradient(145deg,#12121e,#0d0d16);border:1px solid var(--border);border-radius:22px;padding:38px 30px;box-shadow:0 30px 80px rgba(124,58,237,.15),0 10px 30px rgba(0,0,0,.5);transform-style:preserve-3d;transition:transform .15s ease}
  .scene:hover .card{transform:rotateX(2deg) rotateY(-2deg)}
  h1{font-size:26px;font-weight:800;letter-spacing:-.5px;background:linear-gradient(90deg,#a78bfa,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:6px}
  .sub{color:var(--mut);font-size:13px;margin-bottom:26px}
  label{display:block;font-size:12px;color:var(--mut);margin-bottom:6px;font-weight:600}
  input{width:100%;padding:13px 14px;background:#0a0a12;border:1px solid var(--border);border-radius:12px;color:var(--text);font-size:14px;outline:none;transition:.2s}
  input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,58,237,.2)}
  .field{margin-bottom:16px}
  button{width:100%;padding:13px;border:none;border-radius:12px;background:linear-gradient(90deg,#7c3aed,#22d3ee);color:#fff;font-weight:800;font-size:14px;cursor:pointer;transition:.2s;box-shadow:0 10px 30px rgba(124,58,237,.35)}
  button:hover{filter:brightness(1.15);transform:translateY(-1px)}
  .switch{text-align:center;margin-top:18px;font-size:13px;color:var(--mut)}
  .switch a{color:#a78bfa;text-decoration:none;font-weight:600}
  .err{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.35);color:#fca5a5;padding:10px;border-radius:10px;font-size:12px;margin-bottom:12px;display:none}
  .tabs{display:flex;gap:8px;margin-bottom:22px;background:#0a0a12;padding:6px;border-radius:14px;border:1px solid var(--border)}
  .tabs button{background:transparent;box-shadow:none;padding:10px;border-radius:10px;color:var(--mut);font-weight:700;font-size:13px}
  .tabs button.active{background:linear-gradient(90deg,#7c3aed,#22d3ee);color:#fff}
</style>
</head>
<body>
<div class="scene">
  <div class="card">
    <h1>VanD4rk Hosting</h1>
    <p class="sub">Telegram bot hosting platformu · 3D arayüz</p>
    <div class="tabs">
      <button id="tabLogin" class="active" onclick="switchTab('login')">Giriş</button>
      <button id="tabReg" onclick="switchTab('reg')">Kayıt</button>
    </div>
    <div class="err" id="err"></div>

    <div id="loginForm">
      <div class="field"><label>Kullanıcı Adı</label><input id="lu" placeholder="kullanici_adi"></div>
      <div class="field"><label>Şifre</label><input id="lp" type="password" placeholder="••••••••"></div>
      <button onclick="doLogin()">Giriş Yap →</button>
    </div>

    <div id="regForm" style="display:none">
      <div class="field"><label>Kullanıcı Adı</label><input id="ru" placeholder="kullanici_adi"></div>
      <div class="field"><label>Şifre</label><input id="rp" type="password" placeholder="En az 6 karakter"></div>
      <button onclick="doReg()">Kayıt Ol →</button>
    </div>
  </div>
</div>

<script>
function switchTab(t){
  document.getElementById('tabLogin').classList.toggle('active', t==='login');
  document.getElementById('tabReg').classList.toggle('active', t==='reg');
  document.getElementById('loginForm').style.display = t==='login'?'':'none';
  document.getElementById('regForm').style.display = t==='reg'?'':'none';
  document.getElementById('err').style.display='none';
}
function showErr(m){const e=document.getElementById('err');e.textContent=m;e.style.display='block'}
async function doLogin(){
  const r = await fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:lu.value,password:lp.value})});
  const d = await r.json(); if(d.ok) location.href=d.redirect; else showErr(d.error);
}
async function doReg(){
  const r = await fetch('/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:ru.value,password:rp.value})});
  const d = await r.json(); if(d.ok) location.href=d.redirect; else showErr(d.error);
}
</script>
</body>
</html>
