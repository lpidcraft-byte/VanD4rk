<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VanD4rk Hosting — Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#050509; --card:#0d0d16; --card2:#12121e; --border:#1c1c2e;
    --accent:#8b5cf6; --accent2:#06b6d4; --text:#f1f5f9; --mut:#94a3b8;
    --ok:#10b981; --err:#ef4444; --warn:#f59e0b;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',sans-serif;-webkit-tap-highlight-color:transparent}
  body{
    background:
      radial-gradient(900px 700px at 10% 0%, rgba(139,92,246,.12), transparent 60%),
      radial-gradient(800px 600px at 90% 100%, rgba(6,182,212,.1), transparent 60%),
      #050509;
    min-height:100vh; color:var(--text); overflow-x:hidden;
  }
  /* TOPBAR */
  .topbar{
    display:flex; justify-content:space-between; align-items:center;
    padding:14px 28px; border-bottom:1px solid var(--border);
    background:rgba(5,5,9,.7); backdrop-filter:blur(20px);
    position:sticky; top:0; z-index:50;
  }
  .logo{
    font-weight:900; font-size:17px; letter-spacing:-.5px;
    background:linear-gradient(90deg,#c4b5fd,#67e8f9);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    display:flex; align-items:center; gap:10px;
  }
  .logoIcon{
    width:36px;height:36px;border-radius:11px;
    background:linear-gradient(135deg,#8b5cf6,#06b6d4);
    display:grid; place-items:center;
    box-shadow:0 8px 24px -8px rgba(139,92,246,.7);
  }
  .userbox{ display:flex; align-items:center; gap:12px; font-size:13px; color:var(--mut); }
  .userbox b{ color:var(--text); }
  .userbox .sysPill{
    background:#0d0d16; border:1px solid var(--border);
    padding:6px 10px; border-radius:8px; font-size:11px; font-weight:600;
    display:none;
  }
  @media(min-width:600px){ .userbox .sysPill{ display:inline-block; } }
  .userbox a{
    color:#c4b5fd; text-decoration:none; font-weight:700;
    padding:6px 12px; border-radius:8px; background:#12121e; border:1px solid var(--border);
    transition:.2s;
  }
  .userbox a:hover{ background:#1c1c2e; }

  .wrap{ max-width:1300px; margin:0 auto; padding:26px; }

  /* HERO */
  .hero{ perspective:1200px; margin-bottom:22px; }
  .heroCard{
    background:linear-gradient(135deg, rgba(20,20,32,.9), rgba(10,10,18,.95));
    border:1px solid var(--border); border-radius:22px;
    padding:24px 28px; display:flex; justify-content:space-between; align-items:center;
    gap:20px; flex-wrap:wrap;
    box-shadow:0 20px 60px -20px rgba(139,92,246,.3), 0 1px 0 rgba(255,255,255,.05) inset;
    transform-style:preserve-3d; transition:.3s;
  }
  .hero:hover .heroCard{ transform:rotateX(1.5deg); }
  .heroCard h2{ font-size:22px; font-weight:900; letter-spacing:-.6px; }
  .heroCard p{ color:var(--mut); font-size:13px; margin-top:4px; }
  .stats{ display:flex; gap:22px; }
  .stat{ text-align:center; min-width:60px; }
  .stat b{
    display:block; font-size:22px; font-weight:900;
    background:linear-gradient(90deg,#c4b5fd,#67e8f9);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .stat span{ font-size:10px; color:var(--mut); text-transform:uppercase; letter-spacing:.5px; font-weight:700; }

  /* TOOLBAR */
  .toolbar{
    display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap; align-items:center;
  }
  .search{
    flex:1; min-width:200px; position:relative;
  }
  .search input{
    width:100%; padding:11px 14px 11px 40px;
    background:#0d0d16; border:1px solid var(--border);
    border-radius:12px; color:var(--text); font-size:13px; outline:none;
    transition:.2s;
  }
  .search input:focus{ border-color:var(--accent); box-shadow:0 0 0 3px rgba(139,92,246,.15); }
  .search::before{
    content:"🔎"; position:absolute; left:14px; top:50%; transform:translateY(-50%);
    font-size:13px; opacity:.6;
  }
  .chip{
    padding:9px 14px; border-radius:10px; background:#0d0d16; border:1px solid var(--border);
    color:var(--mut); font-size:12px; font-weight:700; cursor:pointer; transition:.2s;
  }
  .chip.active{ background:linear-gradient(135deg,#8b5cf6,#06b6d4); color:#fff; border:none; }
  .chip:hover:not(.active){ background:#12121e; }
  .newBtn{
    padding:11px 18px; border-radius:12px; border:none;
    background:linear-gradient(135deg,#8b5cf6,#06b6d4); color:#fff;
    font-weight:800; font-size:13px; cursor:pointer;
    box-shadow:0 10px 28px -10px rgba(139,92,246,.7);
    transition:.2s;
  }
  .newBtn:hover{ transform:translateY(-2px); filter:brightness(1.1); }

  /* BOT GRID */
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(360px,1fr)); gap:18px; }
  .botCard{
    background:linear-gradient(155deg, rgba(20,20,32,.9), rgba(10,10,18,.95));
    border:1px solid var(--border); border-radius:20px;
    padding:22px; position:relative; overflow:hidden;
    perspective:1000px; transition:.3s cubic-bezier(.2,.8,.2,1);
    box-shadow:0 1px 0 rgba(255,255,255,.04) inset;
  }
  .botCard::before{
    content:""; position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(500px 250px at var(--mx,50%) var(--my,0%), rgba(139,92,246,.18), transparent 70%);
    opacity:0; transition:.25s;
  }
  .botCard:hover::before{ opacity:1; }
  .botCard:hover{
    transform:translateY(-5px);
    border-color:#2c2c44;
    box-shadow:0 30px 70px -20px rgba(139,92,246,.4), 0 20px 40px rgba(0,0,0,.5);
  }
  .botHead{ display:flex; align-items:center; gap:14px; margin-bottom:18px; }
  .pp{
    width:56px;height:56px;border-radius:50%; flex-shrink:0;
    background:linear-gradient(135deg,#8b5cf6,#06b6d4);
    display:grid; place-items:center;
    font-weight:900; font-size:22px; overflow:hidden;
    box-shadow:0 10px 28px -8px rgba(139,92,246,.6), 0 0 0 3px rgba(139,92,246,.1);
  }
  .pp img{ width:100%;height:100%;object-fit:cover; }
  .botName{ font-weight:800; font-size:16px; letter-spacing:-.3px; }
  .botUser{ font-size:12px; color:var(--mut); margin-top:2px; }

  .meta{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px; }
  .meta div{
    background:#07070d; padding:10px 12px; border-radius:12px;
    border:1px solid var(--border);
  }
  .meta span{
    display:block; color:var(--mut); font-size:10px;
    text-transform:uppercase; letter-spacing:.5px; margin-bottom:4px; font-weight:700;
  }
  .meta b{ color:var(--text); font-weight:600; font-size:12px; word-break:break-all; }

  .badge{
    display:inline-flex; align-items:center; gap:5px;
    padding:5px 11px; border-radius:20px;
    font-size:11px; font-weight:800; letter-spacing:.2px;
  }
  .badge.run{ background:rgba(16,185,129,.12); color:#34d399; border:1px solid rgba(16,185,129,.3); }
  .badge.stop{ background:rgba(239,68,68,.12); color:#f87171; border:1px solid rgba(239,68,68,.3); }
  .badge.pend{ background:rgba(245,158,11,.12); color:#fbbf24; border:1px solid rgba(245,158,11,.3); }
  .badge::before{ content:""; width:6px;height:6px;border-radius:50%;background:currentColor; }

  .actions{ display:flex; gap:8px; flex-wrap:wrap; }
  .btn{
    padding:9px 13px; border-radius:10px;
    border:1px solid var(--border); background:#07070d; color:var(--text);
    font-size:12px; font-weight:700; cursor:pointer;
    transition:.2s; display:inline-flex; align-items:center; gap:5px;
  }
  .btn:hover{ background:#12121e; border-color:#2c2c44; transform:translateY(-1px); }
  .btn.pri{ background:linear-gradient(135deg,#8b5cf6,#06b6d4); border:none; color:#fff; box-shadow:0 8px 20px -8px rgba(139,92,246,.6); }
  .btn.pri:hover{ filter:brightness(1.12); }
  .btn.danger{ color:#f87171; border-color:rgba(239,68,68,.3); }
  .btn.danger:hover{ background:rgba(239,68,68,.08); }
  .btn.ghost{ background:transparent; }

  /* EMPTY */
  .empty{ padding:60px 20px; perspective:1000px; }
  .emptyBox{
    background:linear-gradient(155deg, rgba(20,20,32,.85), rgba(10,10,18,.95));
    border:2px dashed #2c2c44; border-radius:28px;
    padding:70px 30px; max-width:500px; margin:0 auto; text-align:center;
    transition:.35s cubic-bezier(.2,.8,.2,1);
    transform-style:preserve-3d;
    box-shadow:0 30px 80px -30px rgba(139,92,246,.4);
  }
  .emptyBox:hover{
    transform:rotateX(3deg) rotateY(-1deg) translateY(-6px);
    border-color:var(--accent);
    box-shadow:0 40px 100px -30px rgba(139,92,246,.6);
  }
  .emptyIcon{
    width:80px;height:80px;border-radius:24px;margin:0 auto 22px;
    background:linear-gradient(135deg,#8b5cf6,#06b6d4);
    display:grid; place-items:center;
    box-shadow:0 20px 50px -15px rgba(139,92,246,.7);
    transform:rotate(-6deg);
  }
  .emptyBox h3{ font-size:22px; margin-bottom:8px; font-weight:900; letter-spacing:-.5px; }
  .emptyBox p{ color:var(--mut); font-size:13px; margin-bottom:26px; line-height:1.6; }
  .emptyBox code{ background:#07070d; padding:2px 8px; border-radius:6px; color:#c4b5fd; font-weight:700; font-size:12px; }

  .uploadBtn{
    padding:16px 34px; border-radius:14px;
    background:linear-gradient(135deg,#8b5cf6,#06b6d4);
    color:#fff; border:none; font-weight:800; font-size:14px;
    cursor:pointer; box-shadow:0 15px 40px -12px rgba(139,92,246,.8);
    transition:.25s;
  }
  .uploadBtn:hover{ transform:translateY(-3px) scale(1.03); filter:brightness(1.12); }

  /* MODAL */
  .modal{
    position:fixed; inset:0; background:rgba(0,0,0,.85);
    display:none; place-items:center; z-index:100;
    backdrop-filter:blur(8px); padding:20px;
  }
  .modal.on{ display:grid; }
  .modalCard{
    background:linear-gradient(155deg,#12121e,#0a0a12);
    border:1px solid var(--border); border-radius:22px;
    padding:28px; max-width:600px; width:100%;
    box-shadow:0 30px 100px rgba(0,0,0,.8);
    animation:pop .3s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes pop{ from{opacity:0; transform:scale(.95)} to{opacity:1; transform:scale(1)} }
  .modalCard h3{ margin-bottom:16px; font-weight:900; letter-spacing:-.4px; }
  .modalCard textarea{
    width:100%; height:300px; background:#050509; color:#67e8f9;
    border:1px solid var(--border); border-radius:14px; padding:14px;
    font-family:ui-monospace,monospace; font-size:11px; resize:vertical;
    outline:none;
  }
  .modalCard textarea:focus{ border-color:var(--accent); }

  /* TOAST */
  .toast{
    position:fixed; bottom:24px; right:24px;
    background:#12121e; border:1px solid var(--border);
    padding:14px 20px; border-radius:14px; font-size:13px; font-weight:600;
    z-index:200; box-shadow:0 20px 60px rgba(0,0,0,.7);
    transform:translateY(120%); transition:.35s cubic-bezier(.2,.8,.2,1);
    max-width:340px;
  }
  .toast.on{ transform:translateY(0); }
  .toast.ok{ border-color:rgba(16,185,129,.5); color:#34d399; }
  .toast.err{ border-color:rgba(239,68,68,.5); color:#f87171; }
  .toast.info{ border-color:rgba(139,92,246,.5); color:#c4b5fd; }

  input[type=file]{ display:none; }

  /* Mobil */
  @media(max-width:640px){
    .wrap{ padding:16px; }
    .topbar{ padding:12px 16px; }
    .heroCard{ padding:18px; }
    .heroCard h2{ font-size:18px; }
    .stats{ gap:14px; }
    .grid{ grid-template-columns:1fr; }
    .logo{ font-size:15px; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">
    <div class="logoIcon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
        <path d="M12 2L3 7l9 5 9-5-9-5z" fill="#fff"/>
        <path d="M3 12l9 5 9-5M3 17l9 5 9-5" stroke="#fff" stroke-width="1.6" stroke-linejoin="round" opacity=".7"/>
      </svg>
    </div>
    VanD4rk Hosting
  </div>
  <div class="userbox">
    <span class="sysPill" id="sysInfo">…</span>
    <span>👤 <b>{{ user.username if user else '' }}</b></span>
    <a href="/logout">Çıkış</a>
  </div>
</div>

<div class="wrap">
  <div class="hero">
    <div class="heroCard">
      <div>
        <h2>Botlarım</h2>
        <p>Telegram botlarını yükle, çalıştır, güncelle.</p>
      </div>
      <div class="stats">
        <div class="stat"><b id="stTotal">0</b><span>Toplam</span></div>
        <div class="stat"><b id="stRun">0</b><span>Çalışan</span></div>
        <div class="stat"><b id="stPend">0</b><span>Onayda</span></div>
      </div>
    </div>
  </div>

  <div class="toolbar" id="toolbar" style="display:none">
    <div class="search">
      <input id="searchInput" placeholder="Bot adı, kullanıcı adı veya ID ara...">
    </div>
    <div class="chip active" data-filter="all">Tümü</div>
    <div class="chip" data-filter="running">Çalışan</div>
    <div class="chip" data-filter="stopped">Durmuş</div>
    <div class="chip" data-filter="pending">Onayda</div>
    <button class="newBtn" onclick="pickUpload()">+ Yeni Bot</button>
  </div>

  <div id="botsArea"></div>
</div>

<input type="file" id="fileUp" accept=".py">
<input type="file" id="fileUpd" accept=".py">

<div class="modal" id="consoleModal">
  <div class="modalCard">
    <h3>Konsol Çıktısı</h3>
    <textarea id="consoleBox" readonly></textarea>
    <div style="margin-top:16px;display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap">
      <button class="btn ghost" onclick="downloadLog()">⬇ Log İndir</button>
      <button class="btn" onclick="document.getElementById('consoleModal').classList.remove('on')">Kapat</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  'use strict';
  const $ = id => document.getElementById(id);
  let BOTS = [], FILTER = 'all', SEARCH = '', currentBid = null;

  function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

  function toast(msg, type){
    const t = $('toast');
    t.textContent = msg; t.className = 'toast on ' + (type||'');
    clearTimeout(t._t); t._t = setTimeout(()=> t.classList.remove('on'), 3200);
  }

  async function api(url, opts){
    try{
      const r = await fetch(url, opts || {credentials:'same-origin'});
      let d;
      try { d = await r.json(); } catch(e){ d = {ok:false,error:'Yanıt okunamadı ('+r.status+')'}; }
      return d;
    }catch(e){ return {ok:false, error:'Bağlantı hatası: '+e.message}; }
  }

  // ---------- Yükle ----------
  async function loadBots(){
    const d = await api('/api/bots');
    if(!d.ok){ toast('Botlar yüklenemedi', 'err'); return; }
    BOTS = d.bots || [];
    $('stTotal').textContent = BOTS.length;
    $('stRun').textContent = BOTS.filter(b=>b.status==='running').length;
    $('stPend').textContent = BOTS.filter(b=>!b.approved).length;
    $('toolbar').style.display = BOTS.length ? 'flex' : 'none';
    render();
  }

  function filtered(){
    return BOTS.filter(b=>{
      if(SEARCH){
        const q = SEARCH.toLowerCase();
        const hay = ((b.name||'')+' '+(b.username||'')+' '+(b.tg_id||'')).toLowerCase();
        if(!hay.includes(q)) return false;
      }
      if(FILTER==='running') return b.approved && b.status==='running';
      if(FILTER==='stopped') return b.approved && b.status!=='running';
      if(FILTER==='pending') return !b.approved;
      return true;
    });
  }

  function render(){
    const area = $('botsArea');
    if(!BOTS.length){
      area.innerHTML = `<div class="empty"><div class="emptyBox">
        <div class="emptyIcon">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none">
            <path d="M12 2L3 7l9 5 9-5-9-5z" fill="#fff"/>
            <path d="M3 12l9 5 9-5M3 17l9 5 9-5" stroke="#fff" stroke-width="1.6" stroke-linejoin="round" opacity=".8"/>
          </svg>
        </div>
        <h3>Henüz botun yok</h3>
        <p>Bir <code>.py</code> dosyası yükle. İçinde BotFather token'ı olmalı.</p>
        <button class="uploadBtn" onclick="pickUpload()">📤 Dosya Yükle</button>
      </div></div>`;
      return;
    }
    const list = filtered();
    if(!list.length){
      area.innerHTML = `<div class="empty" style="padding:40px 20px">
        <p style="color:var(--mut);text-align:center">Aramaya uygun bot bulunamadı.</p></div>`;
      return;
    }
    area.innerHTML = `<div class="grid">${list.map(botCard).join('')}</div>`;
    area.querySelectorAll('.botCard').forEach(c=>{
      c.addEventListener('mousemove', e=>{
        const r = c.getBoundingClientRect();
        c.style.setProperty('--mx', (e.clientX-r.left)+'px');
        c.style.setProperty('--my', (e.clientY-r.top)+'px');
      });
    });
  }

  function botCard(b){
    const statusKey = b.approved ? (b.status==='running'?'run':'stop') : 'pend';
    const badgeText = statusKey==='run' ? 'Çalışıyor' : statusKey==='stop' ? 'Durdu' : 'Onay Bekliyor';
    const initial = (b.name||'B')[0].toUpperCase();
    const pp = b.avatar ? `<img src="${b.avatar}" onerror="this.remove()">` : initial;
    return `<div class="botCard">
      <div class="botHead">
        <div class="pp">${pp}</div>
        <div style="flex:1;min-width:0">
          <div class="botName">${esc(b.name)}</div>
          <div class="botUser">${esc(b.username)}</div>
        </div>
        <span class="badge ${statusKey}">${badgeText}</span>
      </div>
      <div class="meta">
        <div><span>Bot Adı</span><b>${esc(b.name)}</b></div>
        <div><span>Bot ID</span><b>${b.tg_id}</b></div>
        <div><span>Kullanıcı Adı</span><b>${esc(b.username)}</b></div>
        <div><span>Durum</span><b>${b.approved?'Onaylı':'Onay Bekliyor'}</b></div>
      </div>
      <div class="actions">
        <button class="btn pri" onclick="restartBot('${b.id}')">▶ Yeniden Başlat</button>
        <button class="btn" onclick="stopBot('${b.id}')">⏸ Durdur</button>
        <button class="btn" onclick="pickUpdate('${b.id}')">📄 Güncelle</button>
        <button class="btn" onclick="showConsole('${b.id}')">🖥 Konsol</button>
        <button class="btn danger" onclick="delBot('${b.id}')">🗑 Sil</button>
      </div>
    </div>`;
  }

  // ---------- Toolbar ----------
  $('searchInput').addEventListener('input', e=>{ SEARCH = e.target.value; render(); });
  document.querySelectorAll('.chip').forEach(c=>{
    c.addEventListener('click', ()=>{
      document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));
      c.classList.add('active');
      FILTER = c.dataset.filter;
      render();
    });
  });

  // ---------- Dosya seç ----------
  window.pickUpload = ()=>{ currentBid=null; $('fileUp').click(); };
  window.pickUpdate = (bid)=>{ currentBid=bid; $('fileUpd').click(); };

  $('fileUp').addEventListener('change', async e=>{
    const f = e.target.files[0]; if(!f) return;
    if(!f.name.endsWith('.py')){ toast('Sadece .py dosyası', 'err'); e.target.value=''; return; }
    const fd = new FormData(); fd.append('file', f);
    toast('Yükleniyor...', 'info');
    const d = await api('/api/upload', {method:'POST', body:fd, credentials:'same-origin'});
    if(d.ok){ toast('✅ Admin onayına gönderildi', 'ok'); loadBots(); }
    else toast('❌ '+(d.error||'Hata'), 'err');
    e.target.value='';
  });

  $('fileUpd').addEventListener('change', async e=>{
    const f = e.target.files[0]; if(!f || !currentBid) return;
    if(!f.name.endsWith('.py')){ toast('Sadece .py', 'err'); e.target.value=''; return; }
    const fd = new FormData(); fd.append('file', f);
    const d = await api(`/api/bot/${currentBid}/update`, {method:'POST', body:fd, credentials:'same-origin'});
    if(d.ok){ toast('♻️ Güncelleme onaya gönderildi', 'ok'); loadBots(); }
    else toast('❌ '+(d.error||'Hata'), 'err');
    e.target.value='';
  });

  // ---------- Aksiyonlar ----------
  window.restartBot = async bid=>{
    const d = await api(`/api/bot/${bid}/restart`, {method:'POST'});
    if(d.ok) toast('▶ Başlatıldı: '+(d.msg||''), 'ok');
    else toast('❌ '+(d.error||d.msg||'Hata'), 'err');
    loadBots();
  };
  window.stopBot = async bid=>{
    const d = await api(`/api/bot/${bid}/stop`, {method:'POST'});
    if(d.ok) toast('⏸ Durduruldu', 'ok'); else toast('❌ Hata', 'err');
    loadBots();
  };
  window.delBot = async bid=>{
    if(!confirm('Bu botu silmek istediğine emin misin?')) return;
    const d = await api(`/api/bot/${bid}/delete`, {method:'POST'});
    if(d.ok) toast('🗑 Silindi', 'ok'); else toast('❌ Hata', 'err');
    loadBots();
  };
  let lastConsole = '';
  window.showConsole = async bid=>{
    const d = await api(`/api/bot/${bid}`);
    if(d.ok){
      lastConsole = d.console || '(boş)';
      $('consoleBox').value = lastConsole;
      $('consoleModal').classList.add('on');
    } else toast('❌ Konsol alınamadı', 'err');
  };
  window.downloadLog = ()=>{
    if(!lastConsole){ toast('Log yok', 'err'); return; }
    const blob = new Blob([lastConsole], {type:'text/plain'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'bot_console.log'; a.click();
    URL.revokeObjectURL(a.href);
  };

  // ---------- Sistem ----------
  async function loadSystem(){
    const d = await api('/api/system');
    if(d.ok){
      const ru=(d.ram_used/1048576).toFixed(0), rt=(d.ram_total/1048576).toFixed(0);
      $('sysInfo').textContent = `RAM ${ru}/${rt} MB · CPU ${d.cpu.toFixed(0)}%`;
    }
  }

  loadBots(); loadSystem();
  setInterval(loadSystem, 8000);
  setInterval(loadBots, 15000);
})();
</script>
</body>
</html>
